<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>实时协作编辑器</title>
    <style>
      body {
        font-family: Arial;
        margin: 20px;
      }
      #header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #users {
        display: flex;
        gap: 8px;
      }
      .user {
        padding: 4px 10px;
        border-radius: 4px;
        color: white;
        font-size: 12px;
      }
      #editor {
        width: 100%;
        height: 60vh;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      #status {
        color: #888;
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <h2>
        📝 协作编辑 - 文档:
        <span id="docId"></span>
      </h2>
      <div id="users"></div>
    </div>
    <textarea id="editor" placeholder="在此输入..."></textarea>
    <div id="status">未连接</div>

    <script>
      const docId = location.hash.slice(1) || 'demo';
      document.getElementById('docId').textContent = docId;

      const editor = document.getElementById('editor');
      const statusEl = document.getElementById('status');
      const usersEl = document.getElementById('users');

      let ws,
        myId,
        version = 0,
        lastContent = '';
      const users = new Map();
      const pending = []; // 已发送未确认

      function connect() {
        ws = new WebSocket('ws://' + location.host);
        ws.onopen = () => {
          statusEl.textContent = '已连接，加入文档...';
          ws.send(JSON.stringify({ type: 'join', docId }));
        };
        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          handleMessage(msg);
        };
        ws.onclose = () => {
          statusEl.textContent = '断开，3 秒后重连...';
          setTimeout(connect, 3000);
        };
      }

      function renderUsers() {
        usersEl.innerHTML = '';
        for (const [id, u] of users) {
          const el = document.createElement('div');
          el.className = 'user';
          el.style.background = u.color;
          el.textContent = u.name + (id === myId ? ' (我)' : '');
          usersEl.appendChild(el);
        }
      }

      function handleMessage(msg) {
        if (msg.type === 'init') {
          myId = msg.userId;
          editor.value = msg.content;
          lastContent = msg.content;
          version = msg.version;
          msg.users.forEach((u) => users.set(u.id, u));
          renderUsers();
          statusEl.textContent = `已就绪 - 版本 ${version}`;
        } else if (msg.type === 'user-join') {
          users.set(msg.id, { name: msg.name, color: msg.color });
          renderUsers();
        } else if (msg.type === 'user-leave') {
          users.delete(msg.id);
          renderUsers();
        } else if (msg.type === 'ack') {
          pending.shift();
          version = msg.version;
          statusEl.textContent = `版本 ${version}`;
        } else if (msg.type === 'op') {
          // 应用远程操作
          const op = msg.op;
          const cursor = editor.selectionStart;
          if (op.type === 'insert') {
            editor.value = editor.value.slice(0, op.pos) + op.text + editor.value.slice(op.pos);
            if (cursor >= op.pos)
              editor.selectionStart = editor.selectionEnd = cursor + op.text.length;
            else editor.selectionStart = editor.selectionEnd = cursor;
          } else if (op.type === 'delete') {
            editor.value = editor.value.slice(0, op.pos) + editor.value.slice(op.pos + op.len);
            if (cursor > op.pos)
              editor.selectionStart = editor.selectionEnd = Math.max(op.pos, cursor - op.len);
          }
          lastContent = editor.value;
          version = msg.version;
          statusEl.textContent = `版本 ${version}`;
        }
      }

      // 计算 diff 并生成 op
      function diffAndSend() {
        const newContent = editor.value;
        if (newContent === lastContent) return;
        // 简化的 diff：找出最长前缀和后缀
        let start = 0;
        while (
          start < lastContent.length &&
          start < newContent.length &&
          lastContent[start] === newContent[start]
        )
          start++;
        let endOld = lastContent.length,
          endNew = newContent.length;
        while (
          endOld > start &&
          endNew > start &&
          lastContent[endOld - 1] === newContent[endNew - 1]
        ) {
          endOld--;
          endNew--;
        }
        const deleted = lastContent.slice(start, endOld);
        const inserted = newContent.slice(start, endNew);

        if (deleted.length > 0) {
          const op = { type: 'delete', pos: start, len: deleted.length };
          pending.push(op);
          ws.send(JSON.stringify({ type: 'op', op, version }));
        }
        if (inserted.length > 0) {
          const op = { type: 'insert', pos: start, text: inserted };
          pending.push(op);
          ws.send(JSON.stringify({ type: 'op', op, version }));
        }
        lastContent = newContent;
      }

      editor.addEventListener('input', diffAndSend);
      editor.addEventListener('click', () => {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'cursor', pos: editor.selectionStart }));
        }
      });

      connect();
    </script>
  </body>
</html>
