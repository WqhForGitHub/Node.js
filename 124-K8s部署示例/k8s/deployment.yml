apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nest-demo
  template:
    metadata:
      labels:
        app: nest-demo
    spec:
      containers:
        - name: app
          image: nest-demo:latest
          ports:
            - containerPort: 3000
