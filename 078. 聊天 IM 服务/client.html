<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>聊天 IM</title>
    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #f5f5f5;
      }
      #login {
        max-width: 320px;
        margin: 100px auto;
        background: white;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      #login input {
        width: 100%;
        padding: 8px;
        margin: 4px 0;
        box-sizing: border-box;
      }
      #login button {
        width: 48%;
        padding: 8px;
        margin: 4px 1%;
        cursor: pointer;
      }
      #app {
        display: none;
        height: 100vh;
      }
      #sidebar {
        width: 240px;
        background: #2c3e50;
        color: white;
        padding: 12px;
        overflow-y: auto;
        box-sizing: border-box;
      }
      #sidebar h3 {
        font-size: 14px;
        color: #95a5a6;
        margin: 12px 0 4px;
      }
      .item {
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
      }
      .item:hover {
        background: #34495e;
      }
      .item.active {
        background: #3498db;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        background: #95a5a6;
      }
      .dot.online {
        background: #2ecc71;
      }
      #chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      #header {
        padding: 12px;
        background: white;
        border-bottom: 1px solid #ddd;
      }
      #messages {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
      }
      .msg {
        margin: 8px 0;
        max-width: 60%;
        padding: 8px 12px;
        border-radius: 8px;
      }
      .msg.me {
        background: #3498db;
        color: white;
        margin-left: auto;
      }
      .msg.other {
        background: white;
      }
      .msg .from {
        font-size: 11px;
        color: #888;
        margin-bottom: 2px;
      }
      .msg.me .from {
        color: rgba(255, 255, 255, 0.7);
      }
      #input-area {
        padding: 8px;
        background: white;
        border-top: 1px solid #ddd;
        display: flex;
      }
      #input-area input {
        flex: 1;
        padding: 8px;
      }
      #input-area button {
        padding: 8px 16px;
        cursor: pointer;
      }
      #typing {
        font-size: 12px;
        color: #888;
        padding: 4px 12px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <div id="login">
      <h2>聊天 IM</h2>
      <input id="username" placeholder="用户名" />
      <input id="password" type="password" placeholder="密码" />
      <div>
        <button onclick="register()">注册</button>
        <button onclick="login()">登录</button>
      </div>
      <p id="login-error" style="color: red; font-size: 12px"></p>
    </div>

    <div id="app" style="display: none">
      <div style="display: flex; height: 100vh">
        <div id="sidebar">
          <div style="font-weight: bold; margin-bottom: 8px">
            👤
            <span id="me"></span>
          </div>
          <h3>好友</h3>
          <div id="friends"></div>
          <button onclick="addFriendPrompt()" style="width: 100%; padding: 6px; margin-top: 4px">
            + 添加好友
          </button>
          <h3>群组</h3>
          <div id="groups"></div>
          <button onclick="createGroupPrompt()" style="width: 100%; padding: 6px; margin-top: 4px">
            + 创建群
          </button>
          <button onclick="joinGroupPrompt()" style="width: 100%; padding: 6px; margin-top: 4px">
            加入群
          </button>
        </div>
        <div id="chat">
          <div id="header">请选择联系人</div>
          <div id="messages"></div>
          <div id="typing"></div>
          <div id="input-area">
            <input
              id="msg-input"
              placeholder="输入消息..."
              onkeypress="if (event.key === 'Enter') sendMessage();"
              oninput="onTyping()"
            />
            <button onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let ws,
        me,
        currentChat = null;
      const friendsStatus = new Map();
      const groups = new Map();
      let typingTimer;

      async function register() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const r = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await r.json();
        if (data.ok) login();
        else document.getElementById('login-error').textContent = data.error;
      }

      function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        ws = new WebSocket('ws://' + location.host);
        ws.onopen = () => ws.send(JSON.stringify({ type: 'login', username, password }));
        ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
      }

      function handleMessage(msg) {
        if (msg.type === 'login-fail') {
          document.getElementById('login-error').textContent = msg.error;
        } else if (msg.type === 'login-ok') {
          me = msg.user;
          document.getElementById('login').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          document.getElementById('me').textContent = me.username;
          renderFriends();
          me.groups.forEach((g) => loadGroup(g));
        } else if (msg.type === 'presence') {
          friendsStatus.set(msg.user, msg.status);
          renderFriends();
        } else if (msg.type === 'msg-private') {
          if (currentChat && currentChat.type === 'private' && currentChat.id === msg.from) {
            appendMsg(msg.from, msg.content, false);
          } else {
            flashFriend(msg.from);
          }
        } else if (msg.type === 'msg-group') {
          if (currentChat && currentChat.type === 'group' && currentChat.id === msg.groupId) {
            appendMsg(msg.from, msg.content, false);
          }
        } else if (msg.type === 'history') {
          document.getElementById('messages').innerHTML = '';
          msg.messages.forEach((m) => {
            appendMsg(m.from, m.content, m.from === me.username);
          });
        } else if (msg.type === 'offline-messages') {
          alert(`你有 ${msg.messages.length} 条离线消息`);
        } else if (msg.type === 'typing') {
          if (currentChat && currentChat.type === 'private' && currentChat.id === msg.from) {
            document.getElementById('typing').textContent = `${msg.from} 正在输入...`;
            clearTimeout(typingTimer);
            typingTimer = setTimeout(
              () => (document.getElementById('typing').textContent = ''),
              2000
            );
          }
        } else if (msg.type === 'group-created' || msg.type === 'group-joined') {
          if (msg.group) {
            groups.set(msg.group.id, msg.group);
            if (!me.groups.includes(msg.group.id)) me.groups.push(msg.group.id);
            renderGroups();
          }
        } else if (msg.type === 'add-friend-result') {
          if (msg.ok) {
            if (!me.friends.includes(msg.friend)) me.friends.push(msg.friend);
            renderFriends();
          } else {
            alert(msg.error);
          }
        }
      }

      function loadGroup(id) {
        // 简化：直接加入以获取信息
        ws.send(JSON.stringify({ type: 'join-group', groupId: id }));
      }

      function renderFriends() {
        const el = document.getElementById('friends');
        el.innerHTML = me.friends
          .map(
            (f) =>
              `<div class="item" onclick="openChat('private','${f}')">
      <span class="dot ${friendsStatus.get(f) === 'online' ? 'online' : ''}"></span>${f}
    </div>`
          )
          .join('');
      }

      function renderGroups() {
        const el = document.getElementById('groups');
        el.innerHTML = [...groups.values()]
          .map((g) => `<div class="item" onclick="openChat('group','${g.id}')">📁 ${g.name}</div>`)
          .join('');
      }

      function openChat(type, id) {
        currentChat = { type, id };
        const name = type === 'group' ? groups.get(id)?.name || id : id;
        document.getElementById('header').textContent = (type === 'group' ? '📁 ' : '👤 ') + name;
        document.getElementById('messages').innerHTML = '';
        if (type === 'private') {
          ws.send(JSON.stringify({ type: 'history', with: id }));
        } else {
          ws.send(JSON.stringify({ type: 'history', groupId: id }));
        }
      }

      function appendMsg(from, content, isMe) {
        const div = document.createElement('div');
        div.className = 'msg ' + (isMe ? 'me' : 'other');
        div.innerHTML = `<div class="from">${from}</div>${escapeHtml(content)}`;
        document.getElementById('messages').appendChild(div);
        div.scrollIntoView();
      }

      function escapeHtml(s) {
        return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
      }

      function sendMessage() {
        const input = document.getElementById('msg-input');
        const content = input.value.trim();
        if (!content || !currentChat) return;
        if (currentChat.type === 'private') {
          ws.send(JSON.stringify({ type: 'msg-private', to: currentChat.id, content }));
        } else {
          ws.send(JSON.stringify({ type: 'msg-group', groupId: currentChat.id, content }));
        }
        appendMsg(me.username, content, true);
        input.value = '';
      }

      function onTyping() {
        if (currentChat && currentChat.type === 'private') {
          ws.send(JSON.stringify({ type: 'typing', to: currentChat.id }));
        }
      }

      function flashFriend(user) {
        // 简化：弹窗提示
        console.log('收到来自', user, '的消息');
      }

      function addFriendPrompt() {
        const f = prompt('输入好友用户名');
        if (f) ws.send(JSON.stringify({ type: 'add-friend', friend: f }));
      }
      function createGroupPrompt() {
        const name = prompt('群名称');
        if (name) ws.send(JSON.stringify({ type: 'create-group', name }));
      }
      function joinGroupPrompt() {
        const id = prompt('群 ID');
        if (id) ws.send(JSON.stringify({ type: 'join-group', groupId: id }));
      }
    </script>
  </body>
</html>
