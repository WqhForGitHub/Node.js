<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>TS简易聊天室</title>
    <style>
      body {
        font-family: system-ui;
        max-width: 700px;
        margin: 20px auto;
        padding: 0 12px;
      }
      #msgBox {
        height: 400px;
        border: 1px solid #ccc;
        overflow-y: auto;
        padding: 10px;
        margin-bottom: 10px;
      }
      .msg {
        margin: 6px 0;
      }
      .join-tip {
        color: #888;
        font-size: 13px;
      }
      #inputArea {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        padding: 8px;
        font-size: 16px;
      }
      button {
        padding: 8px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>聊天室</h2>
    <div id="msgBox"></div>
    <div id="inputArea">
      <input id="nickInput" placeholder="你的昵称" value="用户" />
      <input id="contentInput" placeholder="输入消息..." />
      <button id="sendBtn">发送</button>
    </div>

    <script>
      // 连接 WebSocket 服务端
      const ws = new WebSocket("ws://localhost:3001");
      // 获取页面元素
      const msgBox = document.getElementById("msgBox");
      const nickInput = document.getElementById("nickInput");
      const contentInput = document.getElementById("contentInput");
      const sendBtn = document.getElementById("sendBtn");

      // 渲染一条消息到聊天框：join 类型灰色提示，chat 类型普通气泡
      function renderMessage(item) {
        const div = document.createElement("div");
        if (item.type === "join") {
          div.className = "msg join-tip";
          div.innerText = `👉 ${item.nickname} ${item.content}`;
        } else {
          div.className = "msg";
          div.innerText = `【${item.nickname}】${item.content}`;
        }
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
      }

      // 连接建立后自动发送上线通知
      ws.onopen = () => {
        ws.send(
          JSON.stringify({
            type: "join",
            nickname: nickInput.value,
            content: "进入聊天室",
          }),
        );
      };

      ws.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        renderMessage(data);
      };

      function sendMessage() {
        const nick = nickInput.value.trim();
        const text = contentInput.value.trim();
        if (!nick || !text) return;
        ws.send(
          JSON.stringify({
            type: "chat",
            nickname: nick,
            content: text,
          }),
        );
        contentInput.value = "";
      }

      sendBtn.onclick = sendMessage;
      contentInput.onkeydown = (e) => {
        if (e.key === "Enter") sendMessage();
      };
    </script>
  </body>
</html>
